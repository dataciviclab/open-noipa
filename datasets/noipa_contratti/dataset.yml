root: "../../out"
schema_version: 1

dataset:
  name: "noipa_contratti"
  source_id: "noipa_sparql"
  tags: [pa, personale, contratti, comparto, inquadramento, mef, noipa]
  category: pubblica-amministrazione
  description: >
    Contratti e inquadramenti personale PA — distribuzione per provincia,
    amministrazione, comparto, livello. Dati NoiPA/MEF (2019-2026).
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

raw:
  sources:
    - name: "noipa_contratti_csv"
      type: "script"
      args:
        command: "python ../../scripts/fetch_noipa.py EntryContrattiGestiti raw_input.csv {year}01 {year}12"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [provincia_della_sede, amministrazione, eta_min, eta_max, sesso, comparto, inquadramento, numero, month]
  validate:
    not_null: [provincia_della_sede, amministrazione, comparto, month]
    min_rows: 100000

mart:
  tables:
    - name: "mart_contratti"
      sql: "sql/mart_contratti.sql"
  required_tables:
    - "mart_contratti"
  validate:
    table_rules:
      mart_contratti:
        required_columns: [provincia_della_sede, amministrazione, eta_min, eta_max, sesso, comparto, inquadramento, numero, month]
        primary_key: [provincia_della_sede, amministrazione, eta_min, eta_max, sesso, comparto, inquadramento, month]
        min_rows: 100000

validation:
  fail_on_error: true
