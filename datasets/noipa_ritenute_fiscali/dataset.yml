root: "../../out"
schema_version: 1

dataset:
  name: "noipa_ritenute_fiscali"
  source_id: "noipa_sparql"
  tags: [pa, personale, redditi, irpef, ritenute, mef, noipa]
  category: pubblica-amministrazione
  description: >
    Ritenute fiscali (IRPEF) personale PA — imponibile, importo IRPEF,
    numero cedolini per comune, amministrazione, genere, eta'.
    Dati NoiPA/MEF (2019-2026).
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

raw:
  sources:
    - name: "noipa_ritenute_csv"
      type: "script"
      args:
        command: "python ../../scripts/fetch_noipa.py EntryCedolinoRitenuteFiscali raw_input.csv {year}01 {year}12"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [comune_della_sede, amministrazione, eta_min, eta_max, sesso, imponibile_fiscale, importo_IRPEF, numero_cedolini, month]
  validate:
    not_null: [comune_della_sede, amministrazione, month]
    primary_key: [comune_della_sede, amministrazione, eta_min, eta_max, sesso, month]
    min_rows: 100000

mart:
  tables:
    - name: "mart_ritenute_fiscali"
      sql: "sql/mart_ritenute_fiscali.sql"
  required_tables:
    - "mart_ritenute_fiscali"
  validate:
    table_rules:
      mart_ritenute_fiscali:
        required_columns: [comune_della_sede, imponibile_mln_eur, irpef_mln_eur, aliota_media_pct, totale_cedolini, imponibile_medio_cedolino, month]
        primary_key: [comune_della_sede, month]
        min_rows: 5000

validation:
  fail_on_error: true
