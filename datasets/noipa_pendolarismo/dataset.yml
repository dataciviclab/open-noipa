root: "../../out"
schema_version: 1

dataset:
  name: "noipa_pendolarismo"
  source_id: "noipa_sparql"
  tags: [pa, personale, pendolarismo, mobilita, mef, noipa]
  category: pubblica-amministrazione
  description: >
    Pendolarismo personale PA — distribuzione per provincia, comune,
    distanza domicilio-lavoro. Dati NoiPA/MEF (2019-2026), CSV aggregati
    dal portale open data.
  years: [2021, 2022, 2023, 2024, 2025, 2026]

raw:
  sources:
    - name: "noipa_pendolarismo_csv"
      type: "script"
      args:
        command: "python ../../scripts/fetch_noipa.py EntryPendolarismo raw_input.csv {year}01 {year}12"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [provincia_della_sede, comune_della_sede, stesso_comune, distance_min_KM, distance_max_KM, numero_amministrati, month]
  validate:
    not_null: [provincia_della_sede, comune_della_sede, month]
    primary_key: [provincia_della_sede, comune_della_sede, stesso_comune, distance_min_KM, distance_max_KM, month]
    min_rows: 10000

mart:
  tables:
    - name: "mart_pendolarismo"
      sql: "sql/mart_pendolarismo.sql"
  required_tables:
    - "mart_pendolarismo"
  validate:
    table_rules:
      mart_pendolarismo:
        required_columns: [provincia_della_sede, comune_della_sede, stesso_comune, n_dipendenti, pct_stesso_comune, distanza_media_stimata, month]
        min_rows: 3000

validation:
  fail_on_error: true
