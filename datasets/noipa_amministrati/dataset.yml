root: "../../out"
schema_version: 1

dataset:
  name: "noipa_amministrati"
  source_id: "noipa_sparql"
  tags: [pa, personale, anagrafica, mef, noipa]
  category: pubblica-amministrazione
  description: >
    Anagrafica personale PA — distribuzione per comune, fascia di eta',
    genere. Dati NoiPA/MEF (2019-2026), CSV aggregati dal portale open data.
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

raw:
  sources:
    - name: "noipa_amministrati_csv"
      type: "script"
      args:
        command: "python ../../scripts/fetch_noipa.py EntryAmministrati raw_input.csv {year}01 {year}12"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [comune_della_sede, eta_min, eta_max, sesso, numero, month]
  validate:
    not_null: [comune_della_sede, sesso, month]
    primary_key: [comune_della_sede, eta_min, eta_max, sesso, month]
    min_rows: 100000

mart:
  tables:
    - name: "mart_amministrati"
      sql: "sql/mart_amministrati.sql"
  required_tables:
    - "mart_amministrati"
  validate:
    table_rules:
      mart_amministrati:
        required_columns: [comune_della_sede, totale_amministrati, pct_donne, pct_under35, pct_over55, month]
        primary_key: [comune_della_sede, month]
        min_rows: 5000

validation:
  fail_on_error: true
