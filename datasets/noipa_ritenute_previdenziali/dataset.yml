root: "../../out"
schema_version: 1

dataset:
  name: "noipa_ritenute_previdenziali"
  source_id: "noipa_sparql"
  tags: [pa, personale, previdenza, inps, contributi, mef, noipa]
  category: pubblica-amministrazione
  description: >
    Ritenute previdenziali personale PA — contributi INPS dipendente/datore
    per tipo, comune, amministrazione, genere, eta'. Dati NoiPA/MEF (2019-2026).
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

raw:
  sources:
    - name: "noipa_ritenute_prev_csv"
      type: "script"
      args:
        command: "python ../../scripts/fetch_noipa.py EntryCedolinoRitenutePrevidenziali raw_input.csv {year}01 {year}12"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [comune_della_sede, amministrazione, eta_min, eta_max, sesso, ritenuta_previdenziale, importo_lavoratore, importo_datore, numero_cedolini, month]
  validate:
    not_null: [comune_della_sede, amministrazione, ritenuta_previdenziale, month]
    min_rows: 100000

mart:
  tables:
    - name: "mart_ritenute_previdenziali"
      sql: "sql/mart_ritenute_previdenziali.sql"
  required_tables:
    - "mart_ritenute_previdenziali"
  validate:
    table_rules:
      mart_ritenute_previdenziali:
        required_columns: [ritenuta_previdenziale, totale_lavoratore, totale_datore, totale, n_cedolini, pct_datore, month]
        primary_key: [ritenuta_previdenziale, month]
        min_rows: 5

validation:
  fail_on_error: true
