root: "../../out"
schema_version: 1

dataset:
  name: "noipa_assenze"
  source_id: "noipa_sparql"
  tags: [pa, personale, assenze, malattia, mef, noipa]
  category: pubblica-amministrazione
  description: >
    Assenze contabilizzate personale PA — per causale, granularità
    oraria/giornaliera, comune, amministrazione, genere, eta'.
    Dati NoiPA/MEF (2021-2026), CSV aggregati dal portale open data.
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

raw:
  sources:
    - name: "noipa_assenze_csv"
      type: "script"
      args:
        command: "python ../../scripts/fetch_noipa.py EntryAssenzeContabilizzate raw_input.csv {year}01 {year}12"
        output: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [comune_della_sede, amministrazione, eta_min, eta_max, sesso, motivazione_assenza, granularita_assenza, numero, month]
  validate:
    not_null: [comune_della_sede, motivazione_assenza, granularita_assenza, month]
    min_rows: 100000

mart:
  tables:
    - name: "mart_assenze"
      sql: "sql/mart_assenze.sql"
  required_tables:
    - "mart_assenze"
  validate:
    table_rules:
      mart_assenze:
        required_columns: [motivazione_assenza, granularita_assenza, totale, n_comuni, n_amministrazioni, month]
        primary_key: [motivazione_assenza, granularita_assenza, month]
        min_rows: 10

validation:
  fail_on_error: true
